# Supervised fine-tuning: Qwen2.5-0.5B on 30k UltraChat-style single-turn pairs.
# Mirrors the guide configuration in section 9.2 of the manual.
stage: sft
model_name: Qwen/Qwen2.5-0.5B
train_path: data/processed/sft_train.json
val_path: data/processed/sft_val.json
output_dir: outputs/sft

max_length: 512
per_device_batch_size: 2
grad_accum_steps: 16          # effective batch size 32
learning_rate: 2.0e-5
warmup_ratio: 0.03
schedule: cosine
weight_decay: 0.1
max_grad_norm: 1.0
epochs: 1

reduction: token_mean         # mean over unmasked response tokens in the batch
fp16: true                    # fp16 autocast with fp32 master weights + GradScaler
gradient_checkpointing: false # turn on only if the T4 runs out of memory
eval_every: 100               # optimizer steps
eval_batch_size: 8
max_val_examples: 1000
device: cuda:0
seed: 42
